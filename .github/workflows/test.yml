name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_and_check_coverage:
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            export DOTNET_ROOT="$candidate"
            export PATH="$candidate:$PATH"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi
    - name: "Test"
      working-directory: Fronter.NET.Tests
      shell: pwsh
      run: |
       dotnet test --coverlet --coverlet-output-format lcov --coverlet-exclude "[commonItems]*" --coverlet-file-prefix fronter
    - name: "Locate coverage report"
      id: coverage_report
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem "Fronter.NET.Tests/bin/Debug/net10.0/TestResults/fronter.coverage*.info" |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $coverageFile) {
          throw "Coverage report not found."
        }

        "path=$coverageFile" >> $env:GITHUB_OUTPUT
    - name: Publish coverage report to coveralls.io
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ${{ steps.coverage_report.outputs.path }}

  test:
    strategy:
      matrix:
        os: [[self-hosted, windows], macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Setup Dotnet for use with actions"
      uses: actions/setup-dotnet@v5
      # Only run on GitHub-hosted runners, because self-hosted runners already have the SDK installed.
      if: ${{ runner.environment == 'github-hosted' }}
      with:
        global-json-file: global.json
    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi
    - name: "Test"
      working-directory: Fronter.NET.Tests
      run: |
       dotnet test
